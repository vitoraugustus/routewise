<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>RouteWise</title>
</head>
<body>
    <main>
        <h1>RouteWise</h1>
        <h2>Encontre uma rota que combine com suas prioridades</h2>
        <div class="campo">
            <label for="origem">Origem:</label>
            <input type="text" id="origem">
        </div>
        <br>
        <div class="campo">
            <label for="destino">Destino:</label>
            <input type="text" id="destino">
        </div>
        
        <p>Prioridades:</p>
        <input type="checkbox" id="viagem">
        <label for="viagem">Menor tempo de viagem</label>
        <br>
        <input type="checkbox" id="custo">
        <label for="custo">Menor custo</label>
        <br>
        <input type="checkbox" id="caminhada">
        <label for="caminhada">Menor tempo de caminhada</label>
        <br><br>
        <button>Encontrar rota</button>
    </main>
</body>
</html>
