<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>RouteWise 🚍</title>
</head>
<body>
    <main>
        <h1>RouteWise</h1>
        <h2>Encontre uma rota que combine com suas prioridades</h2>

        <form method="post">
            <div class="campo">
                <label for="origem">Origem:</label>
                <input type="text" id="origem" name="origem">
            </div>
            <br>
            <div class="campo">
                <label for="destino">Destino:</label>
                <input type="text" id="destino" name="destino">
            </div>
            <br>
            <p>Prioridades:</p>
            <input type="radio" id="viagem" name="prioridade" value="tempo">
            <label for="viagem">Menor tempo de viagem</label>
            <br>
            <input type="radio" id="custo" name="prioridade" value="custo">
            <label for="custo">Menor custo</label>
            <br>
            <input type="radio" id="caminhada" name="prioridade" value="caminhada">
            <label for="caminhada">Menor tempo de caminhada</label>
            <br><br>
            <button type="submit">Encontrar rota</button>
        </form>

    {% if resultados is not none %}
        <section class="resultados">
            {% for r in resultados %}
                <div class="rota {% if loop.first %}melhor{% endif %}">
                    <strong>Linha {{ r.nome }}</strong>
                    <span>{{ r.tempo }} min</span>
                    <span>R$ {{ "%.2f"|format(r.tarifa) }}</span>
                </div>
            {% else %}
                <p>Nenhuma rota direta encontrada.</p>
            {% endfor %}
        </section>
    {% endif %}
    </main>
</body>
</html>
